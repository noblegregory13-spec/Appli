<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="manifest" href="./manifest.webmanifest">
<title>FitTrack</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#16181c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding:20px 16px calc(105px + env(safe-area-inset-bottom))}
header{padding:7px 3px 19px}.brand{font-size:11px;font-weight:900;letter-spacing:2px;color:#71808c}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:31px;line-height:1.1;margin:5px 0;font-weight:850}.logo{width:42px;height:42px;border-radius:13px;background:#17191d;color:#d5ff70;display:grid;place-items:center;font-size:21px}
.card{background:#fff;border:1px solid #e7e9ed;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 4px 18px rgba(20,25,35,.045)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:19px;font-weight:800}.muted{font-size:14px;color:#7b838e}.primary{border:0;background:#17191d;color:#fff;border-radius:14px;padding:14px 16px;font-weight:800}.full{width:100%}.secondary{border:1px solid #dfe3e8;background:#fff;color:#17191d;border-radius:12px;padding:11px 14px;font-weight:750}.danger{color:#c43b3b;border-color:#efcaca}
.empty{text-align:center;color:#7b838e;padding:48px 15px}.empty .ico{font-size:42px;margin-bottom:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{font-size:28px;font-weight:900}.badge{display:inline-block;background:#eef8e8;color:#3d8629;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}
.exercise{background:#fff;border:1px solid #e3e6ea;border-radius:18px;margin:13px 0;overflow:hidden}.exhead{padding:15px 16px}.sets{padding:0 10px 12px}.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:7px;align-items:center;border-top:1px solid #edf0f3;padding:8px 0}.set input{width:100%;border:1px solid #dfe3e8;background:#f7f8fa;border-radius:10px;padding:10px;text-align:center}.num{text-align:center;color:#8c949e;font-size:13px}.check{height:40px;width:40px;border-radius:10px;border:1px solid #dfe3e8;background:#fff;color:#9ba2ab;font-weight:900}.check.on{background:#dff4d6;color:#317d20;border-color:#c7e8ba}.addset{width:100%;margin-top:8px;border:1px dashed #cdd3da;background:#fafbfc;border-radius:11px;padding:10px;color:#626b76;font-weight:750}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-top:1px solid #e4e7eb;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{flex:1;border:0;background:none;color:#8b929b;font-size:11px;padding:4px}.nav button.active{color:#17191d;font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.35);display:flex;align-items:flex-end;z-index:30}.modal.hide{display:none}.sheet{background:#fff;width:min(560px,100%);margin:auto;border-radius:24px 24px 0 0;padding:22px;max-height:91vh;overflow:auto}.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#707985;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #dfe3e8;border-radius:12px;font-size:16px}.machine{display:block;width:100%;text-align:left;border:1px solid #e1e4e8;background:#fafbfc;border-radius:12px;padding:12px;margin:6px 0;font-weight:700}
</style>
</head>
<body>
<div class="app"><header><div class="top"><div><div class="brand">FITTRACK</div><h1 id="heading">Mes séances</h1></div><div class="logo">🏋️</div></div></header><main id="content"></main></div>
<nav class="nav"><button id="nHome" class="active"><span>🏋️</span>Séances</button><button id="nProgress"><span>📈</span>Progrès</button><button id="nSettings"><span>⚙️</span>Réglages</button></nav>
<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>
<script>
const DB_NAME="FitTrackDB",DB_VERSION=1;
let db=null,currentId=null;
const machines=["Chest Press","Pec Deck","Shoulder Press","Lat Pulldown","Seated Row","Leg Press","Leg Extension","Leg Curl","Abductor","Adductor","Calf Raise","Biceps Curl","Triceps Extension","Cable Row","Smith Machine"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("workouts"))d.createObjectStore("workouts",{keyPath:"id"});if(!d.objectStoreNames.contains("sessions"))d.createObjectStore("sessions",{keyPath:"id"});};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{const r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function clearStore(store){return new Promise((resolve,reject)=>{const r=db.transaction(store,"readwrite").objectStore(store).clear();r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function getWorkout(id){return new Promise((resolve,reject)=>{const r=db.transaction("workouts","readonly").objectStore("workouts").get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function init(){try{await openDB();renderHome()}catch(e){document.body.innerHTML='<div style="padding:30px">Impossible d’ouvrir la base locale de l’application.</div>'}}
function activeNav(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));$(id).classList.add("active")}
function modal(html){$("sheet").innerHTML=html;$("modal").classList.remove("hide")}
function closeModal(){$("modal").classList.add("hide")}
$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
async function renderHome(){currentId=null;activeNav("nHome");$("heading").textContent="Mes séances";const ws=await all("workouts");let h='<button class="primary full" id="new">＋ Nouvelle séance</button>';if(!ws.length)h+='<div class="empty"><div class="ico">🏋️</div><strong>Bienvenue dans FitTrack</strong><br><span>Crée ton premier programme.</span></div>';ws.forEach(w=>h+=`<div class="card workout" data-id="${w.id}"><div class="row"><div><div class="title">${esc(w.name)}</div><div class="muted" style="margin-top:4px">${w.exercises.length} exercice${w.exercises.length>1?"s":""}</div></div><div style="font-size:25px;color:#a0a6ae">›</div></div></div>`);$("content").innerHTML=h;$("new").onclick=createWorkout;document.querySelectorAll(".workout").forEach(x=>x.onclick=()=>openWorkout(x.dataset.id))}
function createWorkout(){modal('<h2>Nouvelle séance</h2><div class="field"><label>Nom</label><input id="wn" placeholder="Ex. Push, Jambes, Full Body"></div><button class="primary full" id="create">Créer ma séance</button>');$("create").onclick=async()=>{const w={id:uid(),name:$("wn").value.trim()||"Ma séance",exercises:[]};await put("workouts",w);closeModal();openWorkout(w.id)}}
async function lastSession(workoutId){const ss=await all("sessions");ss.sort((a,b)=>new Date(a.date)-new Date(b.date));for(let i=ss.length-1;i>=0;i--)if(ss[i].workoutId===workoutId)return ss[i];return null}
async function openWorkout(id){currentId=id;const w=await getWorkout(id);const old=await lastSession(id);$("heading").textContent=w.name;activeNav("nHome");let h='<div class="row" style="margin-bottom:12px"><button class="secondary" id="back">← Retour</button><button class="primary" id="finish">Terminer</button></div>';if(old)h+='<div class="card"><span class="badge">DERNIÈRE SÉANCE</span><div class="muted" style="margin-top:7px">Les performances précédentes sont reprises automatiquement.</div></div>';if(!w.exercises.length)h+='<div class="empty"><div class="ico">➕</div><strong>Ajoute ta première machine</strong></div>';w.exercises.forEach((ex,ei)=>{const prev=old?.exercises.find(x=>x.exerciseId===ex.id);h+=`<section class="exercise"><div class="exhead"><div class="row"><div><div class="title">${esc(ex.name)}</div><div class="muted">${ex.sets.length} séries</div></div><button class="check" data-del="${ei}">✕</button></div></div><div class="sets"><div class="set"><div></div><div class="muted" style="text-align:center">POIDS</div><div class="muted" style="text-align:center">REPS</div><div></div></div>`;ex.sets.forEach((s,si)=>{const p=prev?.sets?.[si]||s;h+=`<div class="set"><div class="num">${si+1}</div><input type="number" step=".5" value="${p.weight}" data-w="${ei},${si}"><input type="number" min="0" value="${p.reps}" data-r="${ei},${si}"><button class="check ${s.done?"on":""}" data-c="${ei},${si}">✓</button></div>`});h+='<button class="addset" data-add="'+ei+'">＋ Ajouter une série</button></div></section>'});h+='<button class="secondary full" id="addEx">＋ Ajouter une machine / exercice</button>';$("content").innerHTML=h;$("back").onclick=renderHome;$("finish").onclick=()=>finish(w);$("addEx").onclick=addExercise;
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=async()=>{const e=w.exercises[+b.dataset.add],s=e.sets[e.sets.length-1]||{weight:0,reps:0,done:false};e.sets.push({weight:s.weight,reps:s.reps,done:false});await put("workouts",w);openWorkout(w.id)});
document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Supprimer cet exercice ?")){w.exercises.splice(+b.dataset.del,1);await put("workouts",w);openWorkout(w.id)}});
document.querySelectorAll("[data-w]").forEach(i=>i.onchange=async()=>{let[a,b]=i.dataset.w.split(",").map(Number);w.exercises[a].sets[b].weight=+i.value||0;await put("workouts",w)});
document.querySelectorAll("[data-r]").forEach(i=>i.onchange=async()=>{let[a,b]=i.dataset.r.split(",").map(Number);w.exercises[a].sets[b].reps=+i.value||0;await put("workouts",w)});
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{let[a,c]=b.dataset.c.split(",").map(Number);w.exercises[a].sets[c].done=!w.exercises[a].sets[c].done;await put("workouts",w);openWorkout(w.id)})}
function addExercise(){let h='<h2>Choisir une machine</h2><div class="field"><input id="ms" placeholder="Rechercher..."></div><div id="ml">';machines.forEach(m=>h+=`<button class="machine" data-m="${esc(m)}">${esc(m)}</button>`);h+='</div>';modal(h);$("ms").oninput=function(){const q=this.value.toLowerCase();document.querySelectorAll(".machine").forEach(b=>b.style.display=b.dataset.m.toLowerCase().includes(q)?"block":"none")};document.querySelectorAll(".machine").forEach(b=>b.onclick=async()=>{const w=await getWorkout(currentId);w.exercises.push({id:uid(),name:b.dataset.m,sets:[{weight:0,reps:0,done:false},{weight:0,reps:0,done:false},{weight:0,reps:0,done:false}]});await put("workouts",w);closeModal();openWorkout(w.id)})}
async function finish(w){await put("sessions",{id:uid(),workoutId:w.id,date:new Date().toISOString(),name:w.name,exercises:JSON.parse(JSON.stringify(w.exercises))});alert("Séance enregistrée 💪");renderProgress()}
async function renderProgress(){activeNav("nProgress");$("heading").textContent="Mes progrès";const ss=await all("sessions");ss.sort((a,b)=>new Date(b.date)-new Date(a.date));let volume=0;ss.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(x=>volume+=x.weight*x.reps)));let h=`<div class="stats"><div class="card"><div class="stat">${ss.length}</div><div class="muted">séances</div></div><div class="card"><div class="stat">${Math.round(volume)}</div><div class="muted">kg de volume</div></div></div>`;if(!ss.length)h+='<div class="empty"><div class="ico">📈</div><strong>Pas encore de données</strong><br><span>Termine une séance pour commencer.</span></div>';ss.forEach(s=>{h+=`<div class="card"><div class="title">${esc(s.name)}</div><div class="muted" style="margin-top:4px">${new Date(s.date).toLocaleDateString("fr-FR")}</div><div style="margin-top:10px">${s.exercises.map(e=>`<div class="muted"><strong style="color:#30343a">${esc(e.name)}</strong> · ${e.sets.map(x=>x.weight+" kg × "+x.reps).join(" · ")}</div>`).join("")}</div></div>`});$("content").innerHTML=h}
async function renderSettings(){activeNav("nSettings");$("heading").textContent="Réglages";$("content").innerHTML='<div class="card"><div class="title">Sauvegarde locale</div><div class="muted" style="margin:6px 0 14px">Tes programmes et ton historique sont stockés dans IndexedDB sur cet iPhone.</div><button class="secondary full" id="export">Exporter mes données</button><div style="height:8px"></div><button class="secondary full" id="import">Importer une sauvegarde</button><input id="file" type="file" accept=".json,application/json" style="display:none"><div style="height:8px"></div><button class="secondary danger full" id="clear">Effacer toutes les données</button></div><div class="card"><div class="title">Installation iPhone</div><div class="muted" style="margin-top:6px">Dans Safari : Partager → Ajouter à l’écran d’accueil.</div></div>';$("export").onclick=exportData;$("import").onclick=()=>$("file").click();$("file").onchange=importData;$("clear").onclick=async()=>{if(confirm("Effacer tous les programmes et historiques ?")){await clearStore("workouts");await clearStore("sessions");renderHome()}}}
async function exportData(){const payload={version:1,exportedAt:new Date().toISOString(),workouts:await all("workouts"),sessions:await all("sessions")};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fittrack-sauvegarde.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.workouts)||!Array.isArray(o.sessions))throw Error();await clearStore("workouts");await clearStore("sessions");for(const w of o.workouts)await put("workouts",w);for(const s of o.sessions)await put("sessions",s);alert("Sauvegarde restaurée.");renderHome()}catch(x){alert("Fichier de sauvegarde invalide.")}e.target.value=""}
$("nHome").onclick=renderHome;$("nProgress").onclick=renderProgress;$("nSettings").onclick=renderSettings;init();
navigator.serviceWorker?.register("./sw.js").catch(()=>{});
</script></body></html>
