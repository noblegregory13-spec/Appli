<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="./manifest.webmanifest">
<title>FitTrack</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17191d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;padding:18px 16px 100px}h1{font-size:30px;margin:4px 0 20px}.brand{font-size:11px;font-weight:800;letter-spacing:2px;color:#7b838e}.card{background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:16px;margin:12px 0}.title{font-size:18px;font-weight:800}.muted{color:#7b838e;font-size:14px}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800;font-size:15px}.primary{background:#17191d;color:white;width:100%}.secondary{background:white;border:1px solid #dfe3e8}.danger{color:#b52f2f}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding:8px;z-index:10}.nav button{flex:1;border:0;background:none;padding:7px;color:#777;font-size:11px}.nav button b{display:block;font-size:21px}.exercise{border:1px solid #e2e5e9;border-radius:16px;background:#fff;margin:12px 0;overflow:hidden}.exhead{padding:14px}.set{display:grid;grid-template-columns:28px 1fr 1fr 42px;gap:6px;padding:8px 10px;border-top:1px solid #eee;align-items:center}.set input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;text-align:center;font-size:16px}.check{width:42px;height:42px;border:1px solid #ddd;background:#fff;border-radius:10px}.check.done{background:#dff4d6}.add{width:100%;padding:11px;border:1px dashed #ccc;background:#fafafa;border-radius:10px;font-weight:700}.modal{position:fixed;inset:0;background:#0005;z-index:20;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px;margin:8px 0}.machine{width:100%;text-align:left;padding:13px;border:1px solid #ddd;background:#fafafa;border-radius:10px;margin:4px 0;font-weight:700}.empty{text-align:center;padding:45px 10px;color:#777}
</style>
</head>
<body>
<div class="app">
<div class="brand">FITTRACK</div>
<h1 id="title">Mes séances</h1>
<main id="main"></main>
</div>
<nav class="nav">
<button data-page="home"><b>🏋️</b>Séances</button>
<button data-page="progress"><b>📈</b>Progrès</button>
<button data-page="settings"><b>⚙️</b>Réglages</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
"use strict";
var DB="FitTrackDB",db,workoutId=null;
var machines=["Chest Press","Pec Deck","Shoulder Press","Lat Pulldown","Seated Row","Leg Press","Leg Extension","Leg Curl","Abductor","Adductor","Calf Raise","Biceps Curl","Triceps Extension","Cable Row","Smith Machine"];
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]})}
function id(){return Date.now()+"-"+Math.random().toString(16).slice(2)}
function openDB(){return new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains("workouts"))d.createObjectStore("workouts",{keyPath:"id"});if(!d.objectStoreNames.contains("sessions"))d.createObjectStore("sessions",{keyPath:"id"})};r.onsuccess=function(){db=r.result;resolve()};r.onerror=function(){reject(r.error)}})}
function all(store){return new Promise(function(resolve,reject){var r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function get(store,key){return new Promise(function(resolve,reject){var r=db.transaction(store,"readonly").objectStore(store).get(key);r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function put(store,obj){return new Promise(function(resolve,reject){var r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}
function clear(store){return new Promise(function(resolve,reject){var r=db.transaction(store,"readwrite").objectStore(store).clear();r.onsuccess=function(){resolve()};r.onerror=function(){reject(r.error)}})}
function show(html){$("sheet").innerHTML=html;$("modal").classList.remove("hidden")}
function hide(){$("modal").classList.add("hidden")}
function page(p){if(p==="home")home();if(p==="progress")progress();if(p==="settings")settings()}
async function home(){workoutId=null;$("title").textContent="Mes séances";var ws=await all("workouts"),h='<button class="btn primary" id="newWorkout">＋ Nouvelle séance</button>';if(!ws.length)h+='<div class="empty">🏋️<br><br><b>Aucune séance</b><br>Crée ton premier programme.</div>';ws.forEach(function(w){h+='<div class="card" data-open="'+w.id+'"><div class="row"><div><div class="title">'+esc(w.name)+'</div><div class="muted">'+w.exercises.length+' exercice'+(w.exercises.length>1?"s":"")+'</div></div><b>›</b></div></div>'});$("main").innerHTML=h}
function newWorkout(){show('<h2>Nouvelle séance</h2><input id="workoutName" placeholder="Ex. Jambes, Push, Full Body"><button class="btn primary" id="createWorkout">Créer</button>')}
async function create(){var w={id:id(),name:($("workoutName").value||"Ma séance").trim(),exercises:[]};await put("workouts",w);hide();openWorkout(w.id)}
async function openWorkout(idw){workoutId=idw;var w=await get("workouts",idw);if(!w)return home();$("title").textContent=w.name;var h='<div class="row"><button class="btn secondary" id="back">← Retour</button><button class="btn primary" id="finish">Terminer</button></div>';if(!w.exercises.length)h+='<div class="empty">➕<br><br>Ajoute une machine ci-dessous.</div>';w.exercises.forEach(function(ex,ei){h+='<section class="exercise"><div class="exhead"><div class="row"><div><div class="title">'+esc(ex.name)+'</div><div class="muted">'+ex.sets.length+' séries</div></div><button class="btn secondary" data-remove="'+ei+'">✕</button></div></div>';ex.sets.forEach(function(s,si){h+='<div class="set"><span>'+String(si+1)+'</span><input type="number" step=".5" value="'+(s.weight||0)+'" data-weight="'+ei+','+si+'"><input type="number" value="'+(s.reps||0)+'" data-reps="'+ei+','+si+'"><button class="check '+(s.done?"done":"")+'" data-done="'+ei+','+si+'">✓</button></div>'});h+='<div style="padding:10px"><button class="add" data-add="'+ei+'">＋ Ajouter une série</button></div></section>'});h+='<button class="btn secondary" style="width:100%" id="addExercise">＋ Ajouter une machine</button>';$("main").innerHTML=h}
function addExercise(){var h='<h2>Choisir une machine</h2><input id="search" placeholder="Rechercher une machine">';machines.forEach(function(m){h+='<button class="machine" data-machine="'+esc(m)+'">'+esc(m)+'</button>'});show(h)}
function renderProgress(){progress()}
async function progress(){$("title").textContent="Mes progrès";var ss=await all("sessions"),volume=0;ss.forEach(function(s){s.exercises.forEach(function(e){e.sets.forEach(function(x){volume+=(+x.weight||0)*(+x.reps||0)})})});var h='<div class="row"><div class="card" style="flex:1"><b style="font-size:28px">'+ss.length+'</b><div class="muted">séances</div></div><div class="card" style="flex:1"><b style="font-size:28px">'+Math.round(volume)+'</b><div class="muted">kg volume</div></div></div>';if(!ss.length)h+='<div class="empty">📈<br><br>Aucun historique pour le moment.</div>';ss.sort(function(a,b){return new Date(b.date)-new Date(a.date)}).forEach(function(s){h+='<div class="card"><div class="title">'+esc(s.name)+'</div><div class="muted">'+new Date(s.date).toLocaleDateString("fr-FR")+'</div></div>'});$("main").innerHTML=h}
async function settings(){$("title").textContent="Réglages";$("main").innerHTML='<div class="card"><div class="title">Données locales</div><p class="muted">Tes séances restent sur cet iPhone.</p><button class="btn secondary" style="width:100%" id="export">Exporter</button><br><br><button class="btn secondary danger" style="width:100%" id="erase">Effacer les données</button></div>'}
$("modal").addEventListener("click",function(e){if(e.target===this)hide()});
document.addEventListener("click",async function(e){
var t=e.target.closest("button,[data-open]");if(!t)return;
if(t.dataset.page){page(t.dataset.page);return}
if(t.id==="newWorkout"){newWorkout();return}
if(t.id==="createWorkout"){create();return}
if(t.dataset.open){openWorkout(t.dataset.open);return}
if(t.id==="back"){home();return}
if(t.id==="addExercise"){addExercise();return}
if(t.dataset.machine){var w=await get("workouts",workoutId);w.exercises.push({id:id(),name:t.dataset.machine,sets:[{weight:0,reps:0,done:false},{weight:0,reps:0,done:false},{weight:0,reps:0,done:false}]});await put("workouts",w);hide();openWorkout(workoutId);return}
if(t.dataset.add){var w2=await get("workouts",workoutId),e2=w2.exercises[+t.dataset.add],last=e2.sets[e2.sets.length-1]||{weight:0,reps:0};e2.sets.push({weight:last.weight||0,reps:last.reps||0,done:false});await put("workouts",w2);openWorkout(workoutId);return}
if(t.dataset.remove){var w3=await get("workouts",workoutId);w3.exercises.splice(+t.dataset.remove,1);await put("workouts",w3);openWorkout(workoutId);return}
if(t.dataset.done){var a=t.dataset.done.split(","),w4=await get("workouts",workoutId);w4.exercises[+a[0]].sets[+a[1]].done=!w4.exercises[+a[0]].sets[+a[1]].done;await put("workouts",w4);openWorkout(workoutId);return}
if(t.id==="finish"){var wf=await get("workouts",workoutId);await put("sessions",{id:id(),workoutId:wf.id,name:wf.name,date:new Date().toISOString(),exercises:JSON.parse(JSON.stringify(wf.exercises))});progress();return}
if(t.id==="export"){var payload={workouts:await all("workouts"),sessions:await all("sessions")},blob=new Blob([JSON.stringify(payload)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fittrack.json";a.click();return}
if(t.id==="erase"){if(confirm("Effacer toutes les données ?")){await clear("workouts");await clear("sessions");home()}return}
});
document.addEventListener("change",async function(e){var t=e.target;if(t.dataset.weight||t.dataset.reps){var a=(t.dataset.weight||t.dataset.reps).split(","),w=await get("workouts",workoutId),s=w.exercises[+a[0]].sets[+a[1]];if(t.dataset.weight)s.weight=+t.value||0;else s.reps=+t.value||0;await put("workouts",w)}});
document.addEventListener("input",function(e){if(e.target.id==="search"){var q=e.target.value.toLowerCase();document.querySelectorAll("[data-machine]").forEach(function(b){b.style.display=b.dataset.machine.toLowerCase().indexOf(q)>=0?"block":"none"})}});
openDB().then(home).catch(function(){document.body.innerHTML="<div style='padding:30px'>Erreur de stockage local. Recharge Safari.</div>"});
})();
</script>
</body>
</html>
